<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* ===============================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL = "https://ozdcpgesiraqughaajog.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ===============================
   OWNER LOGIN
================================ */

async function ownerLogin() {

    const email =
        document.getElementById("ownerEmail").value.trim();

    const password =
        document.getElementById("ownerPassword").value;

    const status =
        document.getElementById("loginStatus");

    if (!email || !password) {
        status.textContent =
            "Please enter your email and password.";
        return;
    }

    status.textContent = "Logging in...";

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {
        status.textContent =
            "Login failed: " + error.message;
        return;
    }

    status.textContent =
        "Logged in successfully.";

    updateOwnerInterface();
}


async function ownerLogout() {

    const { error } =
        await supabaseClient.auth.signOut();

    if (error) {

        document.getElementById("loginStatus").textContent =
            "Logout failed: " + error.message;

        return;
    }

    document.getElementById("loginStatus").textContent =
        "You are logged out.";

    updateOwnerInterface();
}


async function updateOwnerInterface() {

    const { data } =
        await supabaseClient.auth.getSession();

    const loggedIn =
        !!data.session;

    document.querySelectorAll(
        ".new-folder, .new-note, .upload-pdf"
    ).forEach(button => {

        button.style.display =
            loggedIn ? "" : "none";

    });

    document.getElementById("loginStatus").textContent =
        loggedIn
            ? "You are logged in as the owner."
            : "Please log in to manage files.";
}


supabaseClient.auth.onAuthStateChange(() => {
    updateOwnerInterface();
});


/* ===============================
   DATA
================================ */

let folders =
    JSON.parse(localStorage.getItem("folders")) || [];

let notes =
    JSON.parse(localStorage.getItem("notes")) || [];

let selectedFolder = null;

let editingNote = null;


/* ===============================
   SAVE DATA
================================ */

function saveData() {

    localStorage.setItem(
        "folders",
        JSON.stringify(folders)
    );

    localStorage.setItem(
        "notes",
        JSON.stringify(notes)
    );
}
