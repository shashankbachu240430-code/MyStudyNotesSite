<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyStudyNotesSite.com</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #1e293b;
            overflow-x: hidden;
            position: relative;
        }

        /* WATER BUBBLE ANIMATION */
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-repeat: no-repeat;
        }

        body::before {
            background-image:
                radial-gradient(circle at 12% 92%, rgba(59,130,246,.18) 0 7px, transparent 8px),
                radial-gradient(circle at 78% 88%, rgba(56,189,248,.16) 0 5px, transparent 6px),
                radial-gradient(circle at 45% 96%, rgba(14,165,233,.14) 0 9px, transparent 10px),
                radial-gradient(circle at 91% 70%, rgba(96,165,250,.15) 0 6px, transparent 7px);
            animation: bubblesUp 12s linear infinite;
        }

        body::after {
            background-image:
                radial-gradient(circle at 25% 98%, rgba(125,211,252,.16) 0 4px, transparent 5px),
                radial-gradient(circle at 65% 94%, rgba(59,130,246,.14) 0 6px, transparent 7px),
                radial-gradient(circle at 84% 99%, rgba(14,165,233,.16) 0 8px, transparent 9px);
            animation: bubblesUp 16s linear 2s infinite;
        }

        @keyframes bubblesUp {
            0% {
                transform: translateY(30px);
                opacity: .25;
            }

            50% {
                opacity: .8;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        /* PAGE-OPEN ENTRANCE ANIMATION */
        @keyframes siteHeaderIn {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes siteContentIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoGlowIn {
            0% {
                opacity: 0;
                transform: scale(.96);
            }

            60% {
                opacity: 1;
                transform: scale(1.03);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* EXTRA INTERACTION ANIMATIONS */
        @keyframes sectionSlideIn {
            from {
                opacity: 0;
                transform: translateX(24px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-12px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulseIcon {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        /* SLOW UP AND DOWN ICON ANIMATION */
        @keyframes bounceIcon {
            0%, 100% {
                transform: translateY(0);
            }

            25% {
                transform: translateY(-8px);
            }

            50% {
                transform: translateY(0);
            }

            75% {
                transform: translateY(6px);
            }
        }

        @keyframes progressShine {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 200% 0;
            }
        }

        @keyframes softSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pageFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        button,
        .folder,
        .card {
            transition:
                transform .22s ease,
                box-shadow .22s ease,
                opacity .22s ease,
                filter .22s ease;
        }

        button:not(:disabled):hover {
            transform: translateY(-2px);
            filter: brightness(1.03);
        }

        button:not(:disabled):active {
            transform: translateY(1px) scale(.98);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(30,41,59,.14);
        }

        .folder:hover {
            transform: translateX(4px);
            box-shadow: 0 7px 18px rgba(30,41,59,.10);
        }

        .section-animate {
            animation: sectionSlideIn .5s ease-out both;
        }

        .icon-pulse {
            display: inline-block;
            animation: pulseIcon 1.8s ease-in-out infinite;
        }

        .icon-bounce {
            display: inline-block;
            animation: bounceIcon 1.8s ease-in-out infinite;
            will-change: transform;
        }

        .loading-spinner {
            width: 34px;
            height: 34px;
            border: 4px solid rgba(37,99,235,.18);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: softSpin .8s linear infinite;
            margin: 12px auto;
        }

        .animated-progress {
            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #818cf8,
                    #60a5fa
                );
            background-size: 200% 100%;
            animation: progressShine 2.5s linear infinite;
        }

        .animated-toast {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 9999;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(23,37,84,.96);
            color: white;
            box-shadow: 0 10px 28px rgba(15,23,42,.22);
            pointer-events: none;
            animation: toastIn .35s ease-out both;
        }

        .smooth-page {
            animation: pageFade .45s ease-out both;
        }

        /* HEADER */

        header {
            background: #172554;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            animation: siteHeaderIn .8s ease-out both;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;

            animation:
                logoGlowIn
                1s
                ease-out
                .15s
                both;
        }

        .tagline {
            color: #cbd5e1;
            font-size: 14px;
        }

        /* LAYOUT */

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
            position: relative;
            z-index: 1;

            animation:
                siteContentIn
                .9s
                ease-out
                .2s
                both;
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 15px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;

            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 15px;
        }

        .new-folder {
            background: #2563eb;
            color: white;
        }

        .new-note {
            background: #16a34a;
            color: white;
        }

        .upload-pdf {
            background: #f59e0b;
            color: white;
        }

        .sidebar button:hover {
            opacity: 0.85;
        }

        /* FOLDERS */

        .folder-list {
            margin-top: 20px;
        }

        .folder {
            padding: 12px;
            margin-bottom: 7px;

            border-radius: 7px;

            cursor: pointer;
            background: #f1f5f9;
        }

        .folder:hover {
            background: #e2e8f0;
        }

        .folder.active {
            background: #dbeafe;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            min-width: 0;
        }

        .current-folder {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .search {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 15px;
        }

        /* EDITOR */

        .editor {
            display: none;

            background: white;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .editor input,
        .editor textarea {

            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        .editor textarea {
            height: 250px;
            resize: vertical;
        }

        .save-btn {
            background: #16a34a;
            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;
        }

        .cancel-btn {
            background: #64748b;
            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;
        }

        /* CONTENT */

        .section-title {
            margin: 25px 0 15px;
        }

        .items {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(260px, 1fr));

            gap: 15px;
        }

        .card {

            background: white;

            padding: 20px;

            border-radius: 10px;

            min-width: 0;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {

            color: #555;

            white-space: pre-wrap;

            max-height: 120px;

            overflow: hidden;

            line-height: 1.5;
        }

        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 15px;

            flex-wrap: wrap;

            width: 100%;
        }

        .buttons button {

            padding: 11px 15px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            white-space: nowrap;

            min-width: 86px;

            flex: 0 1 auto;

            font-size: 15px;
        }

        .open {

            background: #2563eb;

            color: white;
        }

        .edit {
            background: #facc15;
        }

        .delete {

            background: #ef4444;

            color: white;
        }

        /* PDF VIEWER */

        #pdfViewer {

            width: 100%;

            height: 650px;

            border: none;

            display: block;

            margin-top: 20px;
        }

        #pdfViewerContainer {
            animation:
                sectionSlideIn
                .5s
                ease-out
                both;
        }

        #pdfViewerContainer.loading::before {

            content: "";

            display: block;

            width: 34px;
            height: 34px;

            margin: 0 auto 8px;

            border:
                4px solid
                rgba(37,99,235,.18);

            border-top-color:
                #2563eb;

            border-radius: 50%;

            animation:
                softSpin
                .8s
                linear
                infinite;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .tagline {
                display: none;
            }

            .container {
                flex-direction: column;
            }

            .sidebar {

                width: 100%;

                border-right: none;

                border-bottom:
                    1px solid #ddd;
            }

            .main {
                padding: 15px;
            }

            .items {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
                width: 100%;
                overflow: visible;
            }

            .buttons {
                gap: 10px;
                overflow: visible;
            }

            .buttons button {
                min-width: 92px;
                min-height: 46px;

                padding:
                    11px 14px;

                flex:
                    0 0 auto;
            }
        }

    </style>

</head>

<body>

<div
    id="siteToast"
    class="animated-toast"
    style="display:none;"
    aria-live="polite">
</div>

<!-- HEADER -->

<header>

    <div class="logo">
        <span class="icon-pulse">📚</span>
        MyStudyNotesSite.com
    </div>

    <div class="tagline">
        Study • Write • Organize • Learn
    </div>

</header>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>
            <span class="icon-bounce">📁</span>
            My Folders
        </h2>

        <button
            class="new-folder"
            onclick="createFolder()">

            <span class="icon-bounce">➕</span>
            New Folder

        </button>

        <button
            class="new-note"
            onclick="openNoteEditor()">

            <span class="icon-bounce">📝</span>
            New Note

        </button>

        <button
            class="upload-pdf"
            onclick="choosePDF()">

            <span class="icon-pulse">📄</span>
            Upload PDF

        </button>

        <input
            type="file"
            id="pdfInput"
            accept="application/pdf"
            style="display:none"
            onchange="uploadPDF(event)"
        >

        <div
            id="folderList"
            class="folder-list">
        </div>

    </aside>

    <!-- MAIN -->

    <main class="main smooth-page">

        <h2
            id="currentFolder"
            class="current-folder">

            <span class="icon-bounce">📁</span>
            Select a folder

        </h2>

        <!-- SEARCH -->

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔍 Search notes..."
            oninput="displayContent()"
        >

        <!-- NOTE EDITOR -->

        <div
            id="editor"
            class="editor section-animate">

            <input
                id="noteTitle"
                placeholder="Enter note title..."
            >

            <textarea
                id="noteContent"
                placeholder="Start typing your notes..."
            ></textarea>

            <button
                class="save-btn"
                onclick="saveNote()">

                💾 Save Note

            </button>

            <button
                class="cancel-btn"
                onclick="closeEditor()">

                Cancel

            </button>

        </div>

        <!-- NOTES -->

        <h2 class="section-title">

            <span class="icon-bounce">📝</span>
            My Notes

        </h2>

        <div
            id="notesContainer"
            class="items">
        </div>

        <!-- PDFS -->

        <h2 class="section-title">

            <span class="icon-bounce">📄</span>
            My PDFs

        </h2>

        <div
            id="pdfContainer"
            class="items">
        </div>

        <!-- PDF VIEWER -->

        <div
            id="pdfViewerContainer"
            class="section-animate"
            style="display:none; margin-top:20px;">

            <button
                onclick="closePDFViewer()"
                style="
                    background:#ef4444;
                    color:white;
                    border:none;
                    padding:10px 16px;
                    border-radius:7px;
                    cursor:pointer;
                    font-size:15px;
                    margin-bottom:10px;
                ">

                ✕ Close PDF

            </button>

            <iframe id="pdfViewer"></iframe>

        </div>

    </main>

</div>

<script>

/* ===============================
   DATA
================================ */

let folders =
    JSON.parse(
        localStorage.getItem("folders")
    ) || [];

let notes =
    JSON.parse(
        localStorage.getItem("notes")
    ) || [];

let selectedFolder = null;

let editingNote = null;


/* ===============================
   SAVE DATA
================================ */

function saveData() {

    localStorage.setItem(
        "folders",
        JSON.stringify(folders)
    );

    localStorage.setItem(
        "notes",
        JSON.stringify(notes)
    );

}


/* ===============================
   CREATE FOLDER
================================ */

function createFolder() {

    const name =
        prompt("Enter folder name:");

    if (!name) {

        return;

    }

    folders.push({

        id: Date.now(),

        name: name

    });

    saveData();

    displayFolders();

}


/* ===============================
   DISPLAY FOLDERS
================================ */

function displayFolders() {

    const container =
        document.getElementById(
            "folderList"
        );

    container.innerHTML = "";

    folders.forEach(folder => {

        const div =
            document.createElement(
                "div"
            );

        div.className = "folder";

        if (
            selectedFolder === folder.id
        ) {

            div.classList.add(
                "active"
            );

        }

        div.textContent =
            "📁 " + folder.name;

        div.onclick = function() {

            selectFolder(folder.id);

        };

        container.appendChild(div);

    });

}


/* ===============================
   SELECT FOLDER
================================ */

function selectFolder(id) {

    selectedFolder = id;

    const folder =
        folders.find(
            f => f.id === id
        );

    document.getElementById(
        "currentFolder"
    ).textContent =
        "📁 " + folder.name;

    displayFolders();

    displayContent();

}


/* ===============================
   NOTE EDITOR
================================ */

function openNoteEditor(
    index = null
) {

    if (
        selectedFolder === null
    ) {

        alert(
            "Please select a folder first."
        );

        return;

    }

    document.getElementById(
        "editor"
    ).style.display = "block";

    editingNote = index;

    if (index !== null) {

        document.getElementById(
            "noteTitle"
        ).value =
            notes[index].title;

        document.getElementById(
            "noteContent"
        ).value =
            notes[index].content;

    } else {

        document.getElementById(
            "noteTitle"
        ).value = "";

        document.getElementById(
            "noteContent"
        ).value = "";

    }

}


/* ===============================
   CLOSE EDITOR
================================ */

function closeEditor() {

    document.getElementById(
        "editor"
    ).style.display = "none";

    editingNote = null;

}


/* ===============================
   SAVE NOTE
================================ */

function saveNote() {

    const title =
        document.getElementById(
            "noteTitle"
        ).value.trim();

    const content =
        document.getElementById(
            "noteContent"
        ).value.trim();

    if (!title || !content) {

        alert(
            "Please enter title and notes."
        );

        return;

    }

    const note = {

        id: Date.now(),

        folderId:
            selectedFolder,

        title:
            title,

        content:
            content,

        date:
            new Date().toLocaleString()

    };

    if (
        editingNote !== null
    ) {

        notes[editingNote] = note;

    } else {

        notes.push(note);

    }

    saveData();

    closeEditor();

    displayContent();

}


/* ===============================
   DISPLAY CONTENT
================================ */

function displayContent() {

    displayNotes();

    displayPDFs();

}


/* ===============================
   DISPLAY NOTES
================================ */

function displayNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );

    container.innerHTML = "";

    if (
        selectedFolder === null
    ) {

        return;

    }

    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();

    notes.forEach(
        (note, index) => {

            if (
                note.folderId !==
                selectedFolder
            ) {

                return;

            }

            if (
                !note.title
                    .toLowerCase()
                    .includes(search)
                &&
                !note.content
                    .toLowerCase()
                    .includes(search)
            ) {

                return;

            }

            const card =
                document.createElement(
                    "div"
                );

            card.className = "card";

            card.innerHTML = `

                <h3>
                    📝
                    ${escapeHTML(
                        note.title
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        note.content
                    )}
                </p>

                <small>
                    ${note.date}
                </small>

                <div class="buttons">

                    <button
                        class="edit"
                        onclick="
                            openNoteEditor(${index})
                        ">

                        ✏️ Edit

                    </button>

                    <button
                        class="delete"
                        onclick="
                            deleteNote(${index})
                        ">

                        🗑️ Delete

                    </button>

                </div>

            `;

            container.appendChild(card);

        }
    );

}


/* ===============================
   DELETE NOTE
================================ */

function deleteNote(index) {

    if (
        !confirm(
            "Are you sure you want to delete this note?"
        )
    ) {

        return;

    }

    notes.splice(index, 1);

    saveData();

    displayContent();

}


/* ===============================
   SAFE TEXT DISPLAY
================================ */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ===============================
   PDF STORAGE
================================ */

const DB_NAME =
    "MyStudyNotesSiteDB";

const DB_VERSION = 1;

const PDF_STORE = "pdfs";


function openPDFDatabase() {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );

            request.onupgradeneeded =
                function(event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames
                            .contains(PDF_STORE)
                    ) {

                        db.createObjectStore(
                            PDF_STORE,
                            {
                                keyPath: "id"
                            }
                        );

                    }

                };

            request.onsuccess =
                function(event) {

                    resolve(
                        event.target.result
                    );

                };

            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* ===============================
   UPLOAD PDF
================================ */

function choosePDF() {

    if (
        selectedFolder === null
    ) {

        alert(
            "Please select a folder first."
        );

        return;

    }

    const input =
        document.getElementById(
            "pdfInput"
        );

    /* Clear the previous selection
       so the same PDF can be selected again. */

    input.value = "";

    input.click();

}


async function uploadPDF(event) {

    const input =
        event.target;

    const file =
        input.files[0];

    if (!file) {

        return;

    }

    if (
        selectedFolder === null
    ) {

        alert(
            "Please select a folder first."
        );

        input.value = "";

        return;

    }

    if (
        file.type !==
        "application/pdf"
    ) {

        alert(
            "Please select a PDF file."
        );

        input.value = "";

        return;

    }

    try {

        const db =
            await openPDFDatabase();

        const pdf = {

            id:
                Date.now() +
                Math.random(),

            folderId:
                selectedFolder,

            name:
                file.name,

            file:
                file

        };

        await new Promise(
            (
                resolve,
                reject
            ) => {

                const transaction =
                    db.transaction(
                        [PDF_STORE],
                        "readwrite"
                    );

                const store =
                    transaction
                        .objectStore(
                            PDF_STORE
                        );

                const request =
                    store.put(pdf);

                request.onsuccess =
                    function() {

                        resolve();

                    };

                request.onerror =
                    function() {

                        reject(
                            request.error
                        );

                    };

                transaction.onerror =
                    function() {

                        reject(
                            transaction.error
                        );

                    };

            }
        );

        input.value = "";

        await displayPDFs();

        alert(
            "PDF uploaded successfully!"
        );

    } catch (error) {

        console.error(
            "PDF upload error:",
            error
        );

        alert(
            "The PDF could not be saved. Please try again."
        );

        input.value = "";

    }

}


/* ===============================
   DISPLAY PDFS
================================ */

async function displayPDFs() {

    const container =
        document.getElementById(
            "pdfContainer"
        );

    container.innerHTML = "";

    if (
        selectedFolder === null
    ) {

        return;

    }

    try {

        const db =
            await openPDFDatabase();

        const pdfs =
            await new Promise(
                (
                    resolve,
                    reject
                ) => {

                    const transaction =
                        db.transaction(
                            [PDF_STORE],
                            "readonly"
                        );

                    const store =
                        transaction.objectStore(
                            PDF_STORE
                        );

                    const request =
                        store.getAll();

                    request.onsuccess =
                        function() {

                            resolve(
                                request.result ||
                                []
                            );

                        };

                    request.onerror =
                        function() {

                            reject(
                                request.error
                            );

                        };

                }
            );

        pdfs
            .filter(
                pdf =>
                    pdf.folderId ===
                    selectedFolder
            )
            .forEach(
                pdf => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "card";

                    card.innerHTML = `

                        <h3>
                            📄
                            ${escapeHTML(
                                pdf.name
                            )}
                        </h3>

                        <div
                            class="buttons">

                            <button
                                class="open"
                                onclick="
                                    openPDF(${pdf.id})
                                ">

                                👁️ Open

                            </button>

                            <button
                                class="delete"
                                onclick="
                                    deletePDF(${pdf.id})
                                ">

                                🗑️ Delete

                            </button>

                        </div>

                    `;

                    container.appendChild(
                        card
                    );

                }
            );

    } catch (error) {

        console.error(
            "PDF display error:",
            error
        );

        container.innerHTML = `

            <div class="card">

                <p>
                    Unable to load PDFs.
                    Please refresh the page
                    and try again.
                </p>

            </div>

        `;

    }

}


/* ===============================
   OPEN PDF
================================ */

async function openPDF(id) {

    try {

        const db =
            await openPDFDatabase();

        const pdf =
            await new Promise(
                (
                    resolve,
                    reject
                ) => {

                    const transaction =
                        db.transaction(
                            [PDF_STORE],
                            "readonly"
                        );

                    const store =
                        transaction.objectStore(
                            PDF_STORE
                        );

                    const request =
                        store.get(id);

                    request.onsuccess =
                        function() {

                            resolve(
                                request.result
                            );

                        };

                    request.onerror =
                        function() {

                            reject(
                                request.error
                            );

                        };

                }
            );

        if (
            !pdf ||
            !pdf.file
        ) {

            alert(
                "PDF not found."
            );

            return;

        }

        const url =
            URL.createObjectURL(
                pdf.file
            );

        const viewer =
            document.getElementById(
                "pdfViewer"
            );

        const viewerContainer =
            document.getElementById(
                "pdfViewerContainer"
            );

        viewer.src = url;

        viewer.style.display =
            "block";

        viewerContainer.style.display =
            "block";

        viewerContainer.scrollIntoView(
            {
                behavior: "smooth"
            }
        );

    } catch (error) {

        console.error(
            "PDF open error:",
            error
        );

        alert(
            "Unable to open this PDF."
        );

    }

}


/* ===============================
   CLOSE PDF VIEWER
================================ */

function closePDFViewer() {

    const viewer =
        document.getElementById(
            "pdfViewer"
        );

    const viewerContainer =
        document.getElementById(
            "pdfViewerContainer"
        );

    viewer.src = "";

    viewer.style.display =
        "none";

    viewerContainer.style.display =
        "none";

}


/* ===============================
   DELETE PDF
================================ */

async function deletePDF(id) {

    if (
        !confirm(
            "Delete this PDF?"
        )
    ) {

        return;

    }

    try {

        const db =
            await openPDFDatabase();

        await new Promise(
            (
                resolve,
                reject
            ) => {

                const transaction =
                    db.transaction(
                        [PDF_STORE],
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        PDF_STORE
                    );

                const request =
                    store.delete(id);

                request.onsuccess =
                    function() {

                        resolve();

                    };

                request.onerror =
                    function() {

                        reject(
                            request.error
                        );

                    };

                transaction.onerror =
                    function() {

                        reject(
                            transaction.error
                        );

                    };

            }
        );

        await displayPDFs();

        closePDFViewer();

    } catch (error) {

        console.error(
            "PDF delete error:",
            error
        );

        alert(
            "Unable to delete this PDF."
        );

    }

}
