<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyStudyNotesSite.com</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #1e293b;
        }

        /* HEADER */

        header {
            background: #172554;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .tagline {
            color: #cbd5e1;
            font-size: 14px;
        }

        /* LAYOUT */

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 15px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;

            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 15px;
        }

        .new-folder {
            background: #2563eb;
            color: white;
        }

        .new-note {
            background: #16a34a;
            color: white;
        }

        .upload-pdf {
            background: #f59e0b;
            color: white;
        }

        .sidebar button:hover {
            opacity: 0.85;
        }

        /* FOLDERS */

        .folder-list {
            margin-top: 20px;
        }

        .folder {
            padding: 12px;
            margin-bottom: 7px;

            border-radius: 7px;

            cursor: pointer;
            background: #f1f5f9;
        }

        .folder:hover {
            background: #e2e8f0;
        }

        .folder.active {
            background: #dbeafe;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .current-folder {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .search {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 15px;
        }

        /* EDITOR */

        .editor {
            display: none;

            background: white;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .editor input,
        .editor textarea {

            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        .editor textarea {
            height: 250px;
            resize: vertical;
        }

        .save-btn {
            background: #16a34a;
            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;
        }

        .cancel-btn {
            background: #64748b;
            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;
        }

        /* CONTENT */

        .section-title {
            margin: 25px 0 15px;
        }

        .items {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(260px, 1fr));

            gap: 15px;
        }

        .card {

            background: white;

            padding: 18px;

            border-radius: 10px;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {

            color: #555;

            white-space: pre-wrap;

            max-height: 120px;

            overflow: hidden;

            line-height: 1.5;
        }

        .buttons {

            display: flex;

            gap: 8px;

            margin-top: 15px;
        }

        .buttons button {

            padding: 8px 12px;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }

        .open {

            background: #2563eb;

            color: white;
        }

        .edit {
            background: #facc15;
        }

        .delete {

            background: #ef4444;

            color: white;
        }

        /* PDF VIEWER */

        #pdfViewer {

            width: 100%;

            height: 650px;

            border: none;

            display: block;

            margin-top: 20px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .tagline {
                display: none;
            }

            .container {
                flex-direction: column;
            }

            .sidebar {

                width: 100%;

                border-right: none;

                border-bottom: 1px solid #ddd;
            }

            .main {
                padding: 15px;
            }

            .items {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        📚 MyStudyNotesSite.com
    </div>

    <div class="tagline">
        Study • Write • Organize • Learn
    </div>

</header>


<div class="container">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>📁 My Folders</h2>


        <button
            class="new-folder"
            onclick="createFolder()">

            ➕ New Folder

        </button>


        <button
            class="new-note"
            onclick="openNoteEditor()">

            📝 New Note

        </button>


        <button
            class="upload-pdf"
            onclick="choosePDF()">

            📄 Upload PDF

        </button>


        <input
            type="file"
            id="pdfInput"
            accept="application/pdf"
            style="display:none"
            onchange="uploadPDF(event)"
        >


        <div
            id="folderList"
            class="folder-list">

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <h2
            id="currentFolder"
            class="current-folder">

            📁 Select a folder

        </h2>


        <!-- SEARCH -->

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔍 Search notes..."
            oninput="displayContent()"
        >


        <!-- NOTE EDITOR -->

        <div
            id="editor"
            class="editor">


            <input
                id="noteTitle"
                placeholder="Enter note title..."
            >


            <textarea
                id="noteContent"
                placeholder="Start typing your notes..."
            ></textarea>


            <button
                class="save-btn"
                onclick="saveNote()">

                💾 Save Note

            </button>


            <button
                class="cancel-btn"
                onclick="closeEditor()">

                Cancel

            </button>

        </div>


        <!-- NOTES -->

        <h2 class="section-title">

            📝 My Notes

        </h2>


        <div
            id="notesContainer"
            class="items">

        </div>


        <!-- PDFS -->

        <h2 class="section-title">

            📄 My PDFs

        </h2>


        <div
            id="pdfContainer"
            class="items">

        </div>


        <!-- PDF VIEWER -->

        <div id="pdfViewerContainer" style="display:none; margin-top:20px;">
            <button
                onclick="closePDFViewer()"
                style="
                    background:#ef4444;
                    color:white;
                    border:none;
                    padding:10px 16px;
                    border-radius:7px;
                    cursor:pointer;
                    font-size:15px;
                    margin-bottom:10px;
                ">
                ✕ Close PDF
            </button>

            <iframe id="pdfViewer"></iframe>
        </div>


    </main>

</div>


<script>


/* ===============================
   DATA
================================ */

let folders =
    JSON.parse(
        localStorage.getItem("folders")
    ) || [];


let notes =
    JSON.parse(
        localStorage.getItem("notes")
    ) || [];


let selectedFolder = null;

let editingNote = null;


/* ===============================
   SAVE DATA
================================ */

function saveData() {

    localStorage.setItem(
        "folders",
        JSON.stringify(folders)
    );

    localStorage.setItem(
        "notes",
        JSON.stringify(notes)
    );

}


/* ===============================
   CREATE FOLDER
================================ */

function createFolder() {

    const name =
        prompt("Enter folder name:");

    if (!name) {

        return;

    }


    folders.push({

        id: Date.now(),

        name: name

    });


    saveData();

    displayFolders();

}


/* ===============================
   DISPLAY FOLDERS
================================ */

function displayFolders() {

    const container =
        document.getElementById(
            "folderList"
        );


    container.innerHTML = "";


    folders.forEach(folder => {

        const div =
            document.createElement("div");


        div.className = "folder";


        if (
            selectedFolder === folder.id
        ) {

            div.classList.add("active");

        }


        div.textContent =
            "📁 " + folder.name;


        div.onclick = function() {

            selectFolder(folder.id);

        };


        container.appendChild(div);

    });

}


/* ===============================
   SELECT FOLDER
================================ */

function selectFolder(id) {

    selectedFolder = id;


    const folder =
        folders.find(
            f => f.id === id
        );


    document.getElementById(
        "currentFolder"
    ).textContent =
        "📁 " + folder.name;


    displayFolders();

    displayContent();

}


/* ===============================
   NOTE EDITOR
================================ */

function openNoteEditor(index = null) {

    if (selectedFolder === null) {

        alert(
            "Please select a folder first."
        );

        return;

    }


    document.getElementById(
        "editor"
    ).style.display = "block";


    editingNote = index;


    if (index !== null) {

        document.getElementById(
            "noteTitle"
        ).value =
            notes[index].title;


        document.getElementById(
            "noteContent"
        ).value =
            notes[index].content;

    }

    else {

        document.getElementById(
            "noteTitle"
        ).value = "";


        document.getElementById(
            "noteContent"
        ).value = "";

    }

}


/* ===============================
   CLOSE EDITOR
================================ */

function closeEditor() {

    document.getElementById(
        "editor"
    ).style.display = "none";


    editingNote = null;

}


/* ===============================
   SAVE NOTE
================================ */

function saveNote() {

    const title =
        document.getElementById(
            "noteTitle"
        ).value.trim();


    const content =
        document.getElementById(
            "noteContent"
        ).value.trim();


    if (!title || !content) {

        alert(
            "Please enter title and notes."
        );

        return;

    }


    const note = {

        id: Date.now(),

        folderId: selectedFolder,

        title: title,

        content: content,

        date:
            new Date().toLocaleString()

    };


    if (editingNote !== null) {

        notes[editingNote] = note;

    }

    else {

        notes.push(note);

    }


    saveData();

    closeEditor();

    displayContent();

}


/* ===============================
   DISPLAY CONTENT
================================ */

function displayContent() {

    displayNotes();

    displayPDFs();

}


/* ===============================
   DISPLAY NOTES
================================ */

function displayNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );


    container.innerHTML = "";


    if (selectedFolder === null) {

        return;

    }


    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();


    notes.forEach(
        (note, index) => {

            if (
                note.folderId !==
                selectedFolder
            ) {

                return;

            }


            if (
                !note.title
                    .toLowerCase()
                    .includes(search)
                &&
                !note.content
                    .toLowerCase()
                    .includes(search)
            ) {

                return;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className = "card";


            card.innerHTML = `

                <h3>
                    📝 ${escapeHTML(note.title)}
                </h3>

                <p>
                    ${escapeHTML(note.content)}
                </p>

                <small>
                    ${note.date}
                </small>

                <div class="buttons">

                    <button
                        class="edit"
                        onclick="openNoteEditor(${index})">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete"
                        onclick="deleteNote(${index})">

                        🗑️ Delete

                    </button>

                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* ===============================
   DELETE NOTE
================================ */

function deleteNote(index) {

    if (
        !confirm(
            "Are you sure you want to delete this note?"
        )
    ) {

        return;

    }


    notes.splice(index, 1);

    saveData();

    displayContent();

}


/* ===============================
   SAFE TEXT DISPLAY
================================ */

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ===============================
   PDF STORAGE
================================ */

const DB_NAME = "MyStudyNotesSiteDB";
const DB_VERSION = 1;
const PDF_STORE = "pdfs";

function openPDFDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function(event) {
            const db = event.target.result;

            if (!db.objectStoreNames.contains(PDF_STORE)) {
                db.createObjectStore(PDF_STORE, {
                    keyPath: "id"
                });
            }
        };

        request.onsuccess = function(event) {
            resolve(event.target.result);
        };

        request.onerror = function() {
            reject(request.error);
        };
    });
}

/* ===============================
   UPLOAD PDF
================================ */

function choosePDF() {
    if (selectedFolder === null) {
        alert("Please select a folder first.");
        return;
    }

    const input = document.getElementById("pdfInput");

    // Clear the previous selection so the same PDF can be selected again.
    input.value = "";
    input.click();
}

async function uploadPDF(event) {
    const input = event.target;
    const file = input.files[0];

    if (!file) {
        return;
    }

    if (selectedFolder === null) {
        alert("Please select a folder first.");
        input.value = "";
        return;
    }

    if (file.type !== "application/pdf") {
        alert("Please select a PDF file.");
        input.value = "";
        return;
    }

    try {
        const db = await openPDFDatabase();

        const pdf = {
            id: Date.now() + Math.random(),
            folderId: selectedFolder,
            name: file.name,
            file: file
        };

        await new Promise((resolve, reject) => {
            const transaction = db.transaction([PDF_STORE], "readwrite");
            const store = transaction.objectStore(PDF_STORE);

            const request = store.put(pdf);

            request.onsuccess = function() {
                resolve();
            };

            request.onerror = function() {
                reject(request.error);
            };

            transaction.onerror = function() {
                reject(transaction.error);
            };
        });

        input.value = "";
        await displayPDFs();

        alert("PDF uploaded successfully!");
    } catch (error) {
        console.error("PDF upload error:", error);
        alert("The PDF could not be saved. Please try again.");
        input.value = "";
    }
}

/* ===============================
   DISPLAY PDFS
================================ */

async function displayPDFs() {
    const container = document.getElementById("pdfContainer");
    container.innerHTML = "";

    if (selectedFolder === null) {
        return;
    }

    try {
        const db = await openPDFDatabase();

        const pdfs = await new Promise((resolve, reject) => {
            const transaction = db.transaction([PDF_STORE], "readonly");
            const store = transaction.objectStore(PDF_STORE);
            const request = store.getAll();

            request.onsuccess = function() {
                resolve(request.result || []);
            };

            request.onerror = function() {
                reject(request.error);
            };
        });

        pdfs
            .filter(pdf => pdf.folderId === selectedFolder)
            .forEach(pdf => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <h3>📄 ${escapeHTML(pdf.name)}</h3>

                    <div class="buttons">
                        <button
                            class="open"
                            onclick="openPDF(${pdf.id})">
                            👁️ Open
                        </button>

                        <button
                            class="delete"
                            onclick="deletePDF(${pdf.id})">
                            🗑️ Delete
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });

    } catch (error) {
        console.error("PDF display error:", error);

        container.innerHTML = `
            <div class="card">
                <p>Unable to load PDFs. Please refresh the page and try again.</p>
            </div>
        `;
    }
}

/* ===============================
   OPEN PDF
================================ */

async function openPDF(id) {
    // Open a new tab immediately, while the button click is still active.
    const newTab = window.open("about:blank", "_blank");

    if (!newTab) {
        alert("Please allow pop-ups for this website, then tap Open again.");
        return;
    }

    try {
        const db = await openPDFDatabase();

        const pdf = await new Promise((resolve, reject) => {
            const transaction = db.transaction([PDF_STORE], "readonly");
            const store = transaction.objectStore(PDF_STORE);
            const request = store.get(id);

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        if (!pdf || !pdf.file) {
            newTab.close();
            alert("PDF not found. Please upload it again.");
            return;
        }

        // Create a URL for the saved PDF and open it in the new tab.
        const pdfBlob = pdf.file instanceof Blob
            ? pdf.file
            : new Blob([pdf.file], { type: "application/pdf" });

        const pdfURL = URL.createObjectURL(pdfBlob);
        newTab.location.href = pdfURL;

    } catch (error) {
        console.error("PDF open error:", error);
        newTab.close();
        alert("Unable to open this PDF. Please try uploading it again.");
    }
}
/* ===============================
   CLOSE PDF VIEWER
================================ */

function closePDFViewer() {
    const viewer = document.getElementById("pdfViewer");
    const viewerContainer = document.getElementById("pdfViewerContainer");

    viewer.src = "";
    viewer.style.display = "none";
    viewerContainer.style.display = "none";
}

/* ===============================
   DELETE PDF
================================ */



async function deletePDF(id) {
    if (!confirm("Delete this PDF?")) {
        return;
    }

    try {
        const db = await openPDFDatabase();

        await new Promise((resolve, reject) => {
            const transaction = db.transaction([PDF_STORE], "readwrite");
            const store = transaction.objectStore(PDF_STORE);
            const request = store.delete(id);

            request.onsuccess = function() {
                resolve();
            };

            request.onerror = function() {
                reject(request.error);
            };

            transaction.onerror = function() {
                reject(transaction.error);
            };
        });

        await displayPDFs();

        closePDFViewer();

    } catch (error) {
        console.error("PDF delete error:", error);
        alert("Unable to delete this PDF.");
    }
}

/* ===============================
   START
================================ */

displayFolders();

</script>

</body>

</html>
