<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyStudyNotesSite.com</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #4d7eae;
            color: #1e293b;
        }

        /* HEADER */

        header {
            background: #172554;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .tagline {
            color: #cbd5e1;
            font-size: 14px;
        }

        /* LAYOUT */

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 15px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;

            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 15px;
        }

        .new-folder {
            background: #2563eb;
            color: white;
        }

        .new-note {
            background: #16a34a;
            color: white;
        }

        .upload-pdf {
            background: #f59e0b;
            color: white;
        }

        .sidebar button:hover {
            opacity: 0.85;
        }

        /* FOLDERS */

        .folder-list {
            margin-top: 20px;
        }

        .folder {
            padding: 12px;
            margin-bottom: 7px;

            border-radius: 7px;

            cursor: pointer;
            background: #f1f5f9;
        }

        .folder:hover {
            background: #e2e8f0;
        }

        .folder.active {
            background: #dbeafe;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .current-folder {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .search {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 15px;
        }

        /* EDITOR */

        .editor {
            display: none;

            background: white;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .editor input,
        .editor textarea {

            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        .editor textarea {
            height: 250px;
            resize: vertical;
        }

        .save-btn {
            background: #16a34a;
            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;
        }

        .cancel-btn {
            background: #64748b;
            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;
        }

        /* CONTENT */

        .section-title {
            margin: 25px 0 15px;
        }

        .items {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(260px, 1fr));

            gap: 15px;
        }

        .card {

            background: white;

            padding: 18px;

            border-radius: 10px;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {

            color: #555;

            white-space: pre-wrap;

            max-height: 120px;

            overflow: hidden;

            line-height: 1.5;
        }

        .buttons {

            display: flex;

            gap: 8px;

            margin-top: 15px;
        }

        .buttons button {

            padding: 8px 12px;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }

        .open {

            background: #2563eb;

            color: white;
        }

        .edit {
            background: #facc15;
        }

        .delete {

            background: #ef4444;

            color: white;
        }

        /* PDF VIEWER */

        #pdfViewer {

            width: 100%;

            height: 650px;

            border: none;

            display: block;

            margin-top: 20px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .tagline {
                display: none;
            }

            .container {
                flex-direction: column;
            }

            .sidebar {

                width: 100%;

                border-right: none;

                border-bottom: 1px solid #ddd;
            }

            .main {
                padding: 15px;
            }

            .items {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        📚 MyStudyNotesSite.com
    </div>

    <div class="tagline">
        Study • Write • Organize • Learn
    </div>

</header>


<div class="container">
    <!-- OWNER LOGIN -->
<div id="loginSection" style="
    background:white;
    padding:20px;
    margin:20px;
    border-radius:10px;
">
    <h2>Login</h2>

    <p style="margin:10px 0;">
        Log in to view the study materials. Admin can create, edit, update, delete and upload.
    </p>

    <input
        id="ownerEmail"
        type="email"
        placeholder="Enter your email"
        style="padding:10px; width:100%; max-width:350px; margin-bottom:10px;"
    >

    <br>

    <input
        id="ownerPassword"
        type="password"
        placeholder="Enter your password"
        style="padding:10px; width:100%; max-width:350px; margin-bottom:10px;"
    >

    <br>

    <button
        onclick="ownerLogin()"
        style="padding:10px 18px; background:#2563eb; color:white; border:0; border-radius:6px; cursor:pointer;"
    >
        Login
    </button>

    <button
        onclick="ownerLogout()"
        style="padding:10px 18px; background:#64748b; color:white; border:0; border-radius:6px; cursor:pointer;"
    >
        Logout
    </button>

    <p id="loginStatus" style="margin-top:10px;"></p>
</div>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>📁 My Folders</h2>


        <button
            class="new-folder"
            onclick="createFolder()">

            ➕ New Folder

        </button>


        <button
            class="new-note"
            onclick="openNoteEditor()">

            📝 New Note

        </button>


        <button
            class="upload-pdf"
            onclick="choosePDF()">

            📄 Upload PDF

        </button>


        <input
            type="file"
            id="pdfInput"
            accept="application/pdf"
            style="display:none"
            onchange="uploadPDF(event)"
        >


        <div
            id="folderList"
            class="folder-list">

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <h2
            id="currentFolder"
            class="current-folder">

            📁 Select a folder

        </h2>


        <!-- SEARCH -->

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔍 Search notes..."
            oninput="displayContent()"
        >


        <!-- NOTE EDITOR -->

        <div
            id="editor"
            class="editor">


            <input
                id="noteTitle"
                placeholder="Enter note title..."
            >


            <textarea
                id="noteContent"
                placeholder="Start typing your notes..."
            ></textarea>


            <button
                class="save-btn"
                onclick="saveNote()">

                💾 Save Note

            </button>


            <button
                class="cancel-btn"
                onclick="closeEditor()">

                Cancel

            </button>

        </div>


        <!-- NOTES -->

        <h2 class="section-title">

            📝 My Notes

        </h2>


        <div
            id="notesContainer"
            class="items">

        </div>


        <!-- PDFS -->

        <h2 class="section-title">

            📄 My PDFs

        </h2>


        <div
            id="pdfContainer"
            class="items">

        </div>


        <!-- PDF VIEWER -->

        <div id="pdfViewerContainer" style="display:none; margin-top:20px;">
            <button
                onclick="closePDFViewer()"
                style="
                    background:#ef4444;
                    color:white;
                    border:none;
                    padding:10px 16px;
                    border-radius:7px;
                    cursor:pointer;
                    font-size:15px;
                    margin-bottom:10px;
                ">
                ✕ Close PDF
            </button>

            <iframe id="pdfViewer"></iframe>
        </div>


    </main>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ozdcpgesiraqughaajog.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DCZHIdzjXa7uBaLc7B1dBQ_AbZoGu4B";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_USER_ID =
    "ec9ba898-f360-44fa-b941-db5497794d36";

let currentUser = null;
let folders = [];
let notes = [];
let selectedFolder = null;
let editingNote = null;


function isLoggedIn() {
    return !!currentUser;
}


function isAdmin() {
    return !!currentUser &&
           currentUser.id === ADMIN_USER_ID;
}


/* =========================================================
   LOGIN
========================================================= */

async function ownerLogin() {

    const email =
        document.getElementById("ownerEmail").value.trim();

    const password =
        document.getElementById("ownerPassword").value;

    const status =
        document.getElementById("loginStatus");


    if (!email || !password) {
        status.textContent =
            "Please enter your email and password.";
        return;
    }


    status.textContent = "Logging in...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if (error) {

        console.error("Login error:", error);

        status.textContent =
            "Login failed: " + error.message;

        return;
    }


    currentUser = data.user;

    document.getElementById("ownerPassword").value = "";

    await updateOwnerInterface();
}


async function ownerLogout() {

    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        console.error("Logout error:", error);

        document.getElementById("loginStatus").textContent =
            "Logout failed: " + error.message;

        return;
    }

    currentUser = null;
    selectedFolder = null;
    editingNote = null;

    await updateOwnerInterface();
}


/* =========================================================
   LOGIN / PERMISSION UI
========================================================= */

async function updateOwnerInterface() {

    const { data } =
        await supabaseClient.auth.getSession();

    currentUser =
        data.session ? data.session.user : null;


    const status =
        document.getElementById("loginStatus");

    const admin =
        isAdmin();


    if (!currentUser) {

        status.textContent =
            "Please log in to view the study materials.";

    } else if (admin) {

        status.textContent =
            "Logged in as Admin. You can create, edit, update, delete and upload.";

    } else {

        status.textContent =
            "Logged in as Viewer. You can view the study materials only.";
    }


    document
        .querySelectorAll(
            ".new-folder, .new-note, .upload-pdf"
        )
        .forEach(button => {
            button.style.display =
                admin ? "" : "none";
        });


    const editor =
        document.getElementById("editor");

    if (editor && !admin) {
        editor.style.display = "none";
    }


    if (!currentUser) {

        document.getElementById("folderList").innerHTML =
            "<p>Please log in to view folders.</p>";

        document.getElementById("notesContainer").innerHTML = "";
        document.getElementById("pdfContainer").innerHTML = "";

        return;
    }


    await displayFolders();

    await displayContent();
}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        currentUser =
            session ? session.user : null;

        setTimeout(function() {
            updateOwnerInterface();
        }, 0);
    }
);


/* =========================================================
   FOLDERS
========================================================= */

async function createFolder() {

    if (!isAdmin()) {
        alert("Only the Admin can create folders.");
        return;
    }


    const name =
        prompt("Enter folder name:");


    if (!name || !name.trim()) {
        return;
    }


    const { data, error } =
        await supabaseClient
            .from("folders")
            .insert([
                {
                    name: name.trim()
                }
            ])
            .select()
            .single();


    if (error) {

        console.error(
            "Create folder error:",
            error
        );

        alert(
            "Could not create folder: " +
            error.message
        );

        return;
    }


    folders.push(data);

    await displayFolders();
}


async function displayFolders() {

    const folderList =
        document.getElementById("folderList");


    if (!currentUser) {

        folderList.innerHTML =
            "<p>Please log in to view folders.</p>";

        return;
    }


    folderList.innerHTML =
        "Loading folders...";


    const { data, error } =
        await supabaseClient
            .from("folders")
            .select("*")
            .order("created_at", {
                ascending: true
            });


    if (error) {

        console.error(
            "Load folders error:",
            error
        );

        folderList.innerHTML =
            "Unable to load folders.";

        return;
    }


    folders = data || [];

    folderList.innerHTML = "";


    if (folders.length === 0) {

        folderList.innerHTML =
            "<p>No folders yet.</p>";

        return;
    }


    folders.forEach(folder => {

        const wrapper =
            document.createElement("div");

        wrapper.style.display = "flex";
        wrapper.style.gap = "6px";
        wrapper.style.marginBottom = "7px";


        const button =
            document.createElement("button");

        button.textContent =
            "📁 " + folder.name;

        button.className =
            "folder-item";

        button.style.flex = "1";
        button.style.marginBottom = "0";


        if (selectedFolder === folder.id) {
            button.style.background = "#dbeafe";
            button.style.fontWeight = "bold";
        }


        button.onclick = function() {

            selectedFolder =
                folder.id;

            document.getElementById(
                "currentFolder"
            ).textContent =
                "📁 " + folder.name;

            displayContent();
            displayFolders();
        };


        wrapper.appendChild(button);
        folderList.appendChild(wrapper);
    });
}


/* =========================================================
   NOTE EDITOR
========================================================= */

function openNoteEditor(index = null) {

    if (!isAdmin()) {
        alert("Only the Admin can create or edit notes.");
        return;
    }


    if (selectedFolder === null) {

        alert(
            "Please select a folder first."
        );

        return;
    }


    document.getElementById(
        "editor"
    ).style.display = "block";


    editingNote = index;


    if (index !== null) {

        const note =
            notes[index];

        document.getElementById(
            "noteTitle"
        ).value =
            note.title || "";

        document.getElementById(
            "noteContent"
        ).value =
            note.content || "";

    } else {

        document.getElementById(
            "noteTitle"
        ).value = "";

        document.getElementById(
            "noteContent"
        ).value = "";
    }
}


function closeEditor() {

    document.getElementById(
        "editor"
    ).style.display = "none";

    editingNote = null;
}


/* =========================================================
   NOTES - LOAD FROM SUPABASE
========================================================= */

async function loadNotes() {

    if (!currentUser) {
        notes = [];
        return;
    }


    const { data, error } =
        await supabaseClient
            .from("notes")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(
            "Load notes error:",
            error
        );

        notes = [];

        return;
    }


    notes = data || [];
}


/* =========================================================
   SAVE NOTE
========================================================= */

async function saveNote() {

    if (!isAdmin()) {

        alert(
            "Only the Admin can save notes."
        );

        return;
    }


    if (selectedFolder === null) {

        alert(
            "Please select a folder first."
        );

        return;
    }


    const title =
        document.getElementById(
            "noteTitle"
        ).value.trim();


    const content =
        document.getElementById(
            "noteContent"
        ).value.trim();


    if (!title || !content) {

        alert(
            "Please enter title and notes."
        );

        return;
    }


    let result;


    if (editingNote !== null) {

        const note =
            notes[editingNote];


        result =
            await supabaseClient
                .from("notes")
                .update({
                    folder_id: selectedFolder,
                    title: title,
                    content: content
                })
                .eq("id", note.id)
                .select()
                .single();

    } else {

        result =
            await supabaseClient
                .from("notes")
                .insert([
                    {
                        folder_id: selectedFolder,
                        title: title,
                        content: content
                    }
                ])
                .select()
                .single();
    }


    if (result.error) {

        console.error(
            "Save note error:",
            result.error
        );

        alert(
            "Could not save note: " +
            result.error.message
        );

        return;
    }


    closeEditor();

    await loadNotes();

    await displayContent();
}


/* =========================================================
   DISPLAY CONTENT
========================================================= */

async function displayContent() {

    if (!currentUser) {
        return;
    }


    await loadNotes();

    displayNotes();

    await displayPDFs();
}


/* =========================================================
   DISPLAY NOTES
========================================================= */

function displayNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );


    container.innerHTML = "";


    if (selectedFolder === null) {
        return;
    }


    const search =
        document.getElementById(
            "search"
        ).value
         .trim()
         .toLowerCase();


    notes.forEach((note, index) => {

        if (
            String(note.folder_id) !==
            String(selectedFolder)
        ) {
            return;
        }


        const title =
            String(note.title || "");

        const content =
            String(note.content || "");


        if (
            search &&
            !title.toLowerCase().includes(search) &&
            !content.toLowerCase().includes(search)
        ) {
            return;
        }


        const card =
            document.createElement("div");

        card.className = "card";


        card.innerHTML = `
            <h3>
                📝 ${escapeHTML(title)}
            </h3>

            <p>
                ${escapeHTML(content)}
            </p>

            <small>
                ${escapeHTML(
                    note.created_at
                        ? new Date(
                            note.created_at
                          ).toLocaleString()
                        : ""
                )}
            </small>
        `;


        if (isAdmin()) {

            const buttons =
                document.createElement("div");

            buttons.className =
                "buttons";


            const editButton =
                document.createElement("button");

            editButton.className =
                "edit";

            editButton.textContent =
                "✏️ Edit";

            editButton.onclick =
                function() {
                    openNoteEditor(index);
                };


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "🗑️ Delete";

            deleteButton.onclick =
                function() {
                    deleteNote(index);
                };


            buttons.appendChild(
                editButton
            );

            buttons.appendChild(
                deleteButton
            );

            card.appendChild(buttons);
        }


        container.appendChild(card);
    });
}


/* =========================================================
   DELETE NOTE
========================================================= */

async function deleteNote(index) {

    if (!isAdmin()) {

        alert(
            "Only the Admin can delete notes."
        );

        return;
    }


    const note =
        notes[index];


    if (!note) {
        return;
    }


    if (
        !confirm(
            "Are you sure you want to delete this note?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("notes")
            .delete()
            .eq("id", note.id);


    if (error) {

        console.error(
            "Delete note error:",
            error
        );

        alert(
            "Could not delete note: " +
            error.message
        );

        return;
    }


    await loadNotes();

    await displayContent();
}


/* =========================================================
   SAFE TEXT
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   PDF
========================================================= */

function choosePDF() {

    if (!isAdmin()) {

        alert(
            "Only the Admin can upload PDFs."
        );

        return;
    }


    if (selectedFolder === null) {

        alert(
            "Please select a folder first."
        );

        return;
    }


    document.getElementById(
        "pdfInput"
    ).click();
}


async function uploadPDF(event) {

    if (!isAdmin()) {

        alert(
            "Only the Admin can upload PDFs."
        );

        event.target.value = "";

        return;
    }


    const input =
        event.target;

    const file =
        input.files[0];


    if (!file) {
        return;
    }


    if (selectedFolder === null) {

        alert(
            "Please select a folder first."
        );

        input.value = "";

        return;
    }


    if (
        file.type !==
        "application/pdf"
    ) {

        alert(
            "Please select a PDF file."
        );

        input.value = "";

        return;
    }


    try {

        const safeName =
            file.name.replace(
                /[^a-zA-Z0-9._ -]/g,
                "_"
            );


        const filePath =
            String(selectedFolder) +
            "/" +
            Date.now() +
            "_" +
            safeName;


        const { error } =
            await supabaseClient
                .storage
                .from("pdfs")
                .upload(
                    filePath,
                    file
                );


        if (error) {

            console.error(
                "PDF upload error:",
                error
            );

            alert(
                "PDF upload failed: " +
                error.message
            );

            input.value = "";

            return;
        }


        input.value = "";

        await displayPDFs();


        alert(
            "PDF uploaded successfully."
        );

    } catch (error) {

        console.error(
            "PDF upload error:",
            error
        );

        alert(
            "The PDF could not be uploaded."
        );

        input.value = "";
    }
}


async function displayPDFs() {

    const container =
        document.getElementById(
            "pdfContainer"
        );


    container.innerHTML = "";


    if (
        !currentUser ||
        selectedFolder === null
    ) {
        return;
    }


    try {

        const { data, error } =
            await supabaseClient
                .storage
                .from("pdfs")
                .list(
                    String(selectedFolder),
                    {
                        limit: 100,
                        sortBy: {
                            column: "name",
                            order: "asc"
                        }
                    }
                );


        if (error) {

            console.error(
                "PDF list error:",
                error
            );

            container.innerHTML =
                "<p>Unable to load PDFs.</p>";

            return;
        }


        const pdfs =
            (data || []).filter(
                item =>
                    item.name &&
                    item.name.toLowerCase()
                        .endsWith(".pdf")
            );


        if (pdfs.length === 0) {

            container.innerHTML =
                "<p>No PDFs in this folder.</p>";

            return;
        }


        pdfs.forEach(pdf => {

            const path =
                String(selectedFolder) +
                "/" +
                pdf.name;


            const card =
                document.createElement("div");

            card.className =
                "card";


            const title =
                document.createElement("h3");

            title.textContent =
                "📄 " + pdf.name;


            const buttons =
                document.createElement("div");

            buttons.className =
                "buttons";


            const openButton =
                document.createElement("button");

            openButton.className =
                "open";

            openButton.textContent =
                "👁️ Open";

            openButton.onclick =
                function() {
                    openPDF(path);
                };


            buttons.appendChild(
                openButton
            );


            if (isAdmin()) {

                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete";

                deleteButton.textContent =
                    "🗑️ Delete";

                deleteButton.onclick =
                    function() {
                        deletePDF(path);
                    };

                buttons.appendChild(
                    deleteButton
                );
            }


            card.appendChild(title);
            card.appendChild(buttons);

            container.appendChild(card);
        });

    } catch (error) {

        console.error(
            "PDF display error:",
            error
        );

        container.innerHTML =
            "<p>Unable to load PDFs.</p>";
    }
}


/* =========================================================
   OPEN PDF
========================================================= */

async function openPDF(path) {

    try {

        const { data, error } =
            await supabaseClient
                .storage
                .from("pdfs")
                .createSignedUrl(
                    path,
                    3600
                );


        if (error) {

            console.error(
                "PDF open error:",
                error
            );

            alert(
                "Unable to open PDF: " +
                error.message
            );

            return;
        }


        const viewer =
            document.getElementById(
                "pdfViewer"
            );

        const viewerContainer =
            document.getElementById(
                "pdfViewerContainer"
            );


        viewer.src =
            data.signedUrl;

        viewer.style.display =
            "block";

        viewerContainer.style.display =
            "block";

        viewerContainer.scrollIntoView({
            behavior: "smooth"
        });

    } catch (error) {

        console.error(
            "PDF open error:",
            error
        );

        alert(
            "Unable to open this PDF."
        );
    }
}


function closePDFViewer() {

    const viewer =
        document.getElementById(
            "pdfViewer"
        );

    const viewerContainer =
        document.getElementById(
            "pdfViewerContainer"
        );


    viewer.src = "";

    viewer.style.display =
        "none";

    viewerContainer.style.display =
        "none";
}


/* =========================================================
   DELETE PDF
========================================================= */

async function deletePDF(path) {

    if (!isAdmin()) {

        alert(
            "Only the Admin can delete PDFs."
        );

        return;
    }


    if (
        !confirm(
            "Delete this PDF?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseClient
            .storage
            .from("pdfs")
            .remove([path]);


    if (error) {

        console.error(
            "PDF delete error:",
            error
        );

        alert(
            "Unable to delete PDF: " +
            error.message
        );

        return;
    }


    await displayPDFs();
}

   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        await updateOwnerInterface();

    }
);
