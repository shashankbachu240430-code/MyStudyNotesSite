<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStudyNotesSite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}header{background:#1e293b;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:700}.tagline{color:#cbd5e1}.container{display:flex;min-height:calc(100vh - 65px)}.sidebar{width:270px;background:#fff;border-right:1px solid #e2e8f0;padding:20px}.main{flex:1;padding:24px;max-width:1200px;margin:auto;width:100%}.auth-card{max-width:520px;margin:40px auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.auth-card input,.editor input,.editor textarea,.search{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;margin:7px 0 12px;font-size:15px}.auth-card button,.sidebar button,.editor button,.buttons button{border:0;border-radius:7px;padding:10px 15px;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#64748b;color:#fff}.danger{background:#ef4444;color:#fff}.new-folder{background:#2563eb;color:#fff;width:100%;margin-bottom:10px}.new-note{background:#16a34a;color:#fff;width:100%;margin-bottom:10px}.upload-pdf{background:#7c3aed;color:#fff;width:100%;margin-bottom:15px}.folder{padding:11px;border-radius:7px;cursor:pointer;margin-bottom:5px}.folder:hover,.folder.active{background:#e2e8f0}.current-folder{margin-top:0}.editor{background:#fff;padding:18px;border-radius:10px;margin:18px 0;display:none}.editor textarea{height:220px;resize:vertical}.section-title{margin-top:28px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 7px rgba(0,0,0,.08)}.card p{white-space:pre-wrap;line-height:1.5;color:#475569;max-height:150px;overflow:auto}.buttons{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.open{background:#2563eb;color:#fff}.edit{background:#facc15}.delete{background:#ef4444;color:#fff}.status{margin-top:10px;padding:10px;border-radius:7px;background:#f8fafc}.hidden{display:none!important}.viewer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;padding:12px;border-radius:8px;margin-top:20px}.pdf-viewer{width:100%;height:700px;border:0;background:#fff;border-radius:8px;margin-top:10px}.top-actions{display:flex;gap:8px;align-items:center}.muted{color:#64748b;font-size:14px}@media(max-width:700px){header{padding:15px}.tagline{display:none}.container{display:block}.sidebar{width:100%;border-right:0;border-bottom:1px solid #ddd}.main{padding:15px}.items{grid-template-columns:1fr}.pdf-viewer{height:70vh}.top-actions{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <div class="logo">📚 MyStudyNotesSite.com</div>
  <div class="tagline">Study • Write • Organize • Learn</div>
</header>

<section id="authScreen" class="auth-card">
  <div id="loginForm">
    <h2>🔐 Login</h2>
    <p class="muted">Log in to view the study materials.</p>
    <input id="authEmail" type="email" placeholder="Email address" autocomplete="email">
    <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" style="width:100%" onclick="loginUser()">Login</button>
    <button class="secondary" style="width:100%;margin-top:8px" onclick="showSignup()">Create Account</button>
    <p id="authStatus" class="status"></p>
  </div>

  <div id="signupForm" class="hidden">
    <h2>🆕 Create Account</h2>
    <p class="muted">Create your own account. New accounts are viewers, not admins.</p>
    <input id="signupEmail" type="email" placeholder="Email address" autocomplete="email">
    <input id="signupPassword" type="password" placeholder="Create password" autocomplete="new-password">
    <input id="signupConfirm" type="password" placeholder="Confirm password" autocomplete="new-password">
    <button class="primary" style="width:100%" onclick="signupUser()">Create Account</button>
    <button class="secondary" style="width:100%;margin-top:8px" onclick="showLogin()">Back to Login</button>
    <p id="signupStatus" class="status"></p>
  </div>
</section>

<div id="app" class="container hidden">
  <aside class="sidebar">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 style="margin:0">📁 My Folders</h2>
    </div>
    <p id="roleText" class="muted"></p>
    <button class="new-folder admin-only" onclick="createFolder()">➕ New Folder</button>
    <button class="new-note admin-only" onclick="openNoteEditor()">📝 New Note</button>
    <button class="upload-pdf admin-only" onclick="choosePDF()">📄 Upload PDF</button>
    <input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="uploadPDF(event)">
    <div id="folderList"></div>
    <button class="secondary" style="width:100%;margin-top:20px" onclick="logoutUser()">Logout</button>
  </aside>

  <main class="main">
    <div class="top-actions">
      <h2 id="currentFolder" class="current-folder">📁 Select a folder</h2>
    </div>
    <input id="search" class="search" type="text" placeholder="🔍 Search notes..." oninput="displayNotes()">

    <div id="editor" class="editor admin-only">
      <input id="noteTitle" placeholder="Enter note title...">
      <textarea id="noteContent" placeholder="Start typing your notes..."></textarea>
      <button class="primary" onclick="saveNote()">💾 Save Note</button>
      <button class="secondary" onclick="closeEditor()">Cancel</button>
    </div>

    <h2 class="section-title">📝 My Notes</h2>
    <div id="notesContainer" class="items"></div>

    <h2 class="section-title">📄 My PDFs</h2>
    <div id="pdfContainer" class="items"></div>

    <div id="pdfViewerContainer" class="hidden">
      <div class="viewer-bar">
        <strong>📄 PDF Viewer</strong>
        <button class="danger" onclick="closePDFViewer()">✕ Close</button>
      </div>
      <iframe id="pdfViewer" class="pdf-viewer"></iframe>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://ozdcpgesiraqughaajog.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DCZHIdzjXa7uBaLc7B1dBQ_AbZoGu4B";
const ADMIN_USER_ID = "ec9ba898-f360-44fa-b941-db5497794d36";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null;
let selectedFolder = null;
let editingNoteId = null;

function isAdmin(){ return !!currentUser && currentUser.id === ADMIN_USER_ID; }
function showLogin(){document.getElementById('loginForm').classList.remove('hidden');document.getElementById('signupForm').classList.add('hidden');}
function showSignup(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('signupForm').classList.remove('hidden');}
function setStatus(id,msg){document.getElementById(id).textContent=msg;}

async function signupUser(){
  const email=document.getElementById('signupEmail').value.trim();
  const password=document.getElementById('signupPassword').value;
  const confirm=document.getElementById('signupConfirm').value;
  if(!email || !password || !confirm){setStatus('signupStatus','Please fill all fields.');return;}
  if(password.length < 6){setStatus('signupStatus','Password must be at least 6 characters.');return;}
  if(password !== confirm){setStatus('signupStatus','Passwords do not match.');return;}
  setStatus('signupStatus','Creating account...');
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error){setStatus('signupStatus','Account creation failed: '+error.message);return;}
  if(data.session){
    currentUser=data.user;
    await enterApp();
  }else{
    setStatus('signupStatus','Account created. Check your email to confirm the account, then log in.');
  }
}

async function loginUser(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  if(!email || !password){setStatus('authStatus','Please enter your email and password.');return;}
  setStatus('authStatus','Logging in...');
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){setStatus('authStatus','Invalid email or password.');return;}
  currentUser=data.user;
  await enterApp();
}

async function logoutUser(){await supabaseClient.auth.signOut();currentUser=null;selectedFolder=null;document.getElementById('app').classList.add('hidden');document.getElementById('authScreen').classList.remove('hidden');showLogin();setStatus('authStatus','You are logged out.');}

async function checkAccess(){
  if(!currentUser)return false;
  const {data,error}=await supabaseClient.from('profiles').select('active').eq('id',currentUser.id).maybeSingle();
  if(error){console.warn('Profile check:',error.message);return true;}
  if(data && data.active === false){await supabaseClient.auth.signOut();currentUser=null;alert('Your access has been removed by the administrator.');return false;}
  return true;
}

async function enterApp(){
  const allowed=await checkAccess();
  if(!allowed)return;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('hidden',!isAdmin()));
  document.getElementById('roleText').textContent=isAdmin()?'👑 Admin — full access':'👤 Viewer — read-only access';
  await displayFolders();
}

supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
  if(session){currentUser=session.user;await enterApp();}
  else {currentUser=null;document.getElementById('app').classList.add('hidden');document.getElementById('authScreen').classList.remove('hidden');}
});

async function createFolder(){
  if(!isAdmin()){return;}
  const name=prompt('Enter folder name:');
  if(!name || !name.trim())return;
  const {data,error}=await supabaseClient.from('folders').insert({name:name.trim()}).select().single();
  if(error){alert('Could not create folder: '+error.message);return;}
  selectedFolder=data.id;await displayFolders();
}

async function displayFolders(){
  const {data,error}=await supabaseClient.from('folders').select('*').order('name',{ascending:true});
  const container=document.getElementById('folderList');container.innerHTML='';
  if(error){container.innerHTML='<p class="muted">Unable to load folders.</p>';return;}
  if(!data.length){container.innerHTML='<p class="muted">No folders yet.</p>';return;}
  data.forEach(folder=>{
    const div=document.createElement('div');div.className='folder'+(selectedFolder===folder.id?' active':'');div.textContent='📁 '+folder.name;
    div.onclick=()=>selectFolder(folder.id,folder.name);container.appendChild(div);
  });
  if(selectedFolder===null){selectFolder(data[0].id,data[0].name);}
}

async function selectFolder(id,name){selectedFolder=id;document.getElementById('currentFolder').textContent='📁 '+name;await displayFoldersOnly();await displayNotes();await displayPDFs();}
async function displayFoldersOnly(){
  const {data}=await supabaseClient.from('folders').select('*').order('name',{ascending:true});
  const container=document.getElementById('folderList');container.innerHTML='';
  (data||[]).forEach(folder=>{const div=document.createElement('div');div.className='folder'+(selectedFolder===folder.id?' active':'');div.textContent='📁 '+folder.name;div.onclick=()=>selectFolder(folder.id,folder.name);container.appendChild(div);});
}

function openNoteEditor(note=null){
  if(!isAdmin())return;
  if(selectedFolder===null){alert('Please select a folder first.');return;}
  editingNoteId=note?note.id:null;
  document.getElementById('noteTitle').value=note?note.title:'';
  document.getElementById('noteContent').value=note?note.content:'';
  document.getElementById('editor').style.display='block';
}
function closeEditor(){editingNoteId=null;document.getElementById('editor').style.display='none';document.getElementById('noteTitle').value='';document.getElementById('noteContent').value='';}

async function saveNote(){
  if(!isAdmin())return;
  if(selectedFolder===null){alert('Please select a folder first.');return;}
  const title=document.getElementById('noteTitle').value.trim();
  const content=document.getElementById('noteContent').value.trim();
  if(!title || !content){alert('Please enter a title and note content.');return;}
  if(editingNoteId){
    const {error}=await supabaseClient.from('notes').update({title,content}).eq('id',editingNoteId);
    if(error){alert('Could not update note: '+error.message);return;}
  }else{
    const {data:existing}=await supabaseClient.from('notes').select('id').eq('folder_id',selectedFolder).eq('title',title).eq('content',content).limit(1);
    if(existing && existing.length){alert('This exact note already exists, so a duplicate was not created.');closeEditor();await displayNotes();return;}
    const {error}=await supabaseClient.from('notes').insert({folder_id:selectedFolder,title,content});
    if(error){alert('Could not save note: '+error.message);return;}
  }
  closeEditor();await displayNotes();
}

async function displayNotes(){
  const container=document.getElementById('notesContainer');container.innerHTML='';
  if(selectedFolder===null)return;
  const search=(document.getElementById('search').value||'').toLowerCase();
  const {data,error}=await supabaseClient.from('notes').select('*').eq('folder_id',selectedFolder).order('created_at',{ascending:false});
  if(error){container.innerHTML='<p class="muted">Unable to load notes.</p>';return;}
  (data||[]).filter(n=>(n.title||'').toLowerCase().includes(search)||(n.content||'').toLowerCase().includes(search)).forEach(note=>{
    const card=document.createElement('div');card.className='card';
    const h=document.createElement('h3');h.textContent='📝 '+note.title;
    const p=document.createElement('p');p.textContent=note.content;
    card.appendChild(h);card.appendChild(p);
    if(isAdmin()){
      const buttons=document.createElement('div');buttons.className='buttons';
      const edit=document.createElement('button');edit.className='edit';edit.textContent='✏️ Edit';edit.onclick=()=>openNoteEditor(note);
      const del=document.createElement('button');del.className='delete';del.textContent='🗑️ Delete';del.onclick=()=>deleteNote(note.id);
      buttons.append(edit,del);card.appendChild(buttons);
    }
    container.appendChild(card);
  });
}

async function deleteNote(id){
  if(!isAdmin())return;
  if(!confirm('Delete this note?'))return;
  const {error}=await supabaseClient.from('notes').delete().eq('id',id);
  if(error){alert('Could not delete note: '+error.message);return;}
  await displayNotes();
}

function choosePDF(){if(isAdmin())document.getElementById('pdfInput').click();}

async function uploadPDF(event){
  if(!isAdmin()){event.target.value='';return;}
  const file=event.target.files[0];
  if(!file)return;
  if(selectedFolder===null){alert('Please select a folder first.');event.target.value='';return;}
  if(file.type!=='application/pdf'){alert('Please select a PDF file.');event.target.value='';return;}
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=String(selectedFolder)+'/'+safeName;
  const {error}=await supabaseClient.storage.from('pdfs').upload(path,file,{contentType:'application/pdf',upsert:true,cacheControl:'3600'});
  event.target.value='';
  if(error){alert('PDF upload failed: '+error.message);return;}
  await displayPDFs();
  alert('PDF uploaded successfully.');
}

async function displayPDFs(){
  const container=document.getElementById('pdfContainer');container.innerHTML='';
  if(selectedFolder===null)return;
  const {data,error}=await supabaseClient.storage.from('pdfs').list(String(selectedFolder),{limit:100,sortBy:{column:'name',order:'asc'}});
  if(error){container.innerHTML='<p class="muted">Unable to load PDFs.</p>';return;}
  if(!data || !data.length){container.innerHTML='<p class="muted">No PDFs in this folder.</p>';return;}
  data.filter(x=>x.name && x.name.toLowerCase().endsWith('.pdf')).forEach(pdf=>{
    const card=document.createElement('div');card.className='card';
    const h=document.createElement('h3');h.textContent='📄 '+pdf.name;card.appendChild(h);
    const buttons=document.createElement('div');buttons.className='buttons';
    const open=document.createElement('button');open.className='open';open.textContent='👁️ Open PDF';open.onclick=()=>openPDF(String(selectedFolder)+'/'+pdf.name);
    buttons.appendChild(open);
    if(isAdmin()){const del=document.createElement('button');del.className='delete';del.textContent='🗑️ Delete';del.onclick=()=>deletePDF(String(selectedFolder)+'/'+pdf.name);buttons.appendChild(del);}
    card.appendChild(buttons);container.appendChild(card);
  });
}

async function openPDF(path){
  const {data,error}=await supabaseClient.storage.from('pdfs').createSignedUrl(path,300);
  if(error){alert('Unable to open PDF: '+error.message);return;}
  const viewer=document.getElementById('pdfViewer');
  viewer.src=data.signedUrl+'#toolbar=1&navpanes=0&view=FitH';
  document.getElementById('pdfViewerContainer').classList.remove('hidden');
  document.getElementById('pdfViewerContainer').scrollIntoView({behavior:'smooth'});
}
function closePDFViewer(){document.getElementById('pdfViewer').src='';document.getElementById('pdfViewerContainer').classList.add('hidden');}

async function deletePDF(path){
  if(!isAdmin())return;
  if(!confirm('Delete this PDF?'))return;
  const {error}=await supabaseClient.storage.from('pdfs').remove([path]);
  if(error){alert('Could not delete PDF: '+error.message);return;}
  await displayPDFs();
}

function escapeHTML(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}

document.addEventListener('DOMContentLoaded',async()=>{
  const {data}=await supabaseClient.auth.getSession();
  if(data.session){currentUser=data.session.user;await enterApp();}
});
</script>
</body>
</html>
